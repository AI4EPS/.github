name: GitHub traffic

on:
  schedule:
    # Daily, and this cadence is not a preference. GitHub serves only a 14-day
    # rolling window of views and clones; whatever falls out of it is gone and
    # cannot be backfilled. A daily run means two consecutive failures still lose
    # nothing, where a weekly run leaves almost no margin.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-traffic
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas requests

      - name: Collect
        env:
          # NOT secrets.GITHUB_TOKEN: the default Actions token is scoped to this
          # repo alone and returns 403 on every other repo's traffic endpoint.
          # AI4EPS_TRAFFIC_TOKEN must be a PAT with `repo` scope.
          GH_TOKEN: ${{ secrets.AI4EPS_TRAFFIC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AI4EPS_TRAFFIC_TOKEN is not set — traffic history is being lost daily"
            exit 1
          fi
          python scripts/github_traffic.py --org AI4EPS

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-traffic.csv data/github-repos.csv
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: archive GitHub traffic"
            git push
          fi
